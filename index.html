<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Make It</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root {
    --bg: #f4f5f4; --ink: #1b2420; --ink-muted: #55635c; --accent: #0e6e58; --rule: #d8ddd9;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101613; --ink: #e9eeeb; --ink-muted: #9fb0a8; --accent: #3fcfa9; --rule: #24312b;
    }
  }
  :root[data-theme="dark"] { --bg: #101613; --ink: #e9eeeb; --ink-muted: #9fb0a8; --accent: #3fcfa9; --rule: #24312b; }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); margin: 0;
    font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;
  }
  .card { max-width: 480px; text-align: center; }
  h1 { font-size: 2rem; margin: 0 0 12px; }
  p { color: var(--ink-muted); line-height: 1.6; margin: 0 0 28px; }
  nav { display: flex; gap: 18px; justify-content: center; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
  a:hover, a:focus-visible { border-bottom-color: var(--accent); }
</style>
</head><body>
  <div class="card">
    <h1>Make It</h1>
    <p>A personal WhatsApp check-in service for founders.</p>
    <nav>
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Service</a>
    </nav>
  </div>
</body></html>
